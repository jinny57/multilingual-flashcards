<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 다국어 낱말카드</title>
<style>
:root{--ink:#202923;--muted:#64736a;--paper:#f5f7f2;--green:#315d47;--line:#dce4dc;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic","Microsoft YaHei","PingFang SC",sans-serif}
main{max-width:1050px;margin:auto;padding:42px 22px 64px}header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}h1{font-size:clamp(26px,4vw,38px);margin:0 0 8px;letter-spacing:-.04em}.sub{color:var(--muted);margin:0}.count{font-size:14px;color:var(--green);font-weight:700;white-space:nowrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.toolbar button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 16px;font:inherit;cursor:pointer}.toolbar button:hover,.toolbar button:focus-visible{outline:2px solid #88a992}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:16px}.card{perspective:1400px;cursor:pointer;outline:none}.flip{display:grid;height:100%;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}.card.on .flip{transform:rotateY(180deg)}.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;border:2px solid #c9d5ca;background:var(--white);border-radius:18px;padding:10px 16px;box-shadow:0 3px 12px #273d2c0b;display:flex;flex-direction:column;transition:box-shadow .15s}.back{transform:rotateY(180deg)}.card:hover .face,.card:focus-visible .face{box-shadow:0 8px 20px #273d2c1a}.card:focus-visible .face{border-color:#88a992}.front .words{flex:1;margin:0;grid-auto-rows:1fr}.front .entry .lang{grid-row:1/span 2;align-self:center;padding-top:0}.front .word{font-size:23px;line-height:1.2}.front .pron{margin:2px 0 0}.front .word{font-size:20px}.turn{color:var(--green);font-weight:700}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.meaning{font-size:28px;font-weight:750;margin:2px 4px 0}.back .hint{margin:0 4px}.back .words{margin-top:8px;border-top:1px solid #e4e9e3}.meaning{margin-top:6px!important}.hint{font-size:13px;color:var(--muted)}.words{display:grid;gap:0;margin-top:18px}.entry{display:grid;grid-template-columns:74px 1fr;column-gap:10px;align-content:center;padding:10px 6px;border-top:1px solid #e4e9e3}.entry:first-child{border-top:0}.entry>:not(.lang){grid-column:2}.entry .lang{grid-row:1/span 4;color:var(--fg);align-self:start;padding-top:5px;display:flex;align-items:center;gap:6px;white-space:nowrap}.entry .lang:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fg);flex:none}.l-en{--fg:#1d5bc4}.l-es{--fg:#d4500c}.l-de{--fg:#6a2fc4}.l-zh{--fg:#0f8a45}.days{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.days button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;padding:7px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.days button.on{background:var(--green);border-color:var(--green);color:#fff}.lang{font-size:12px;letter-spacing:.02em;color:var(--muted);font-weight:700}.word{font-weight:700;font-size:17px;letter-spacing:-.01em}.pron{color:var(--muted);font-size:13px}.example{font-size:14px;margin-top:2px;line-height:1.45}.pinyin{font-size:13px;color:var(--fg);margin-top:2px;font-style:italic}.translation{font-size:12px;color:var(--muted);margin-top:2px}.review{margin-top:18px;border:2px solid #c9d5ca;border-radius:16px;background:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}.rv-head b{display:block;font-size:15px}.rv-head span{font-size:12px;color:var(--muted)}.rv-days{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:160px}.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}.chip.on{border-color:var(--green);color:var(--green);background:#eef4ef}.chip.on:before{content:"✓ "}.rv-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rv-act select,.ghost{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}.go{background:var(--green);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.go:disabled{background:#a9b8ad;cursor:default}.dtag{font-size:11px;font-weight:700;color:var(--green);border:1px solid #c9d5ca;border-radius:6px;padding:2px 6px;margin-left:8px;vertical-align:middle;letter-spacing:0}.tip{text-align:center;color:var(--muted);font-size:13px;margin:20px 0 0}
@media print{.review,.flip{transform:none!important;display:block}.face{-webkit-backface-visibility:visible;backface-visibility:visible;transform:none}.back{border-top-style:dashed;border-radius:0 0 18px 18px}.front{border-radius:18px 18px 0 0;border-bottom:0}.days,body{background:#fff}main{padding:12px}.toolbar,.tip{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.card{break-inside:avoid}.face{box-shadow:none;padding:13px}.meaning{margin:10px 0 2px;font-size:22px}}
</style></head><body><main>
<header><div><h1>오늘의 다국어 낱말카드</h1><p class="sub">같은 뜻을 영어·스페인어·독일어·중국어로 익혀요</p></div><div class="count" id="count"></div></header>
<nav class="days" id="days" aria-label="날짜별 낱말카드"></nav>
<section class="review" aria-label="랜덤 복습"><div class="rv-head"><b>랜덤 복습</b><span>복습할 날짜를 골라 섞어 보세요</span></div><div class="rv-days" id="rvdays"></div><div class="rv-act"><button class="ghost" id="rvall">전체 선택</button><select id="rvn" aria-label="복습할 카드 수"><option value="0">전부</option><option value="10">10개</option><option value="20">20개</option><option value="30">30개</option></select><button class="go" id="rvgo">복습 시작</button></div></section>
<div class="toolbar"><button id="flipall">모두 뒤집기</button><button onclick="window.print()">인쇄하기</button></div>
<section class="grid" id="cards" aria-label="다국어 낱말카드"></section><p class="tip">카드를 눌러 뒤집으면 한국어 뜻과 예문이 나와요 · 중국어 발음은 병음 · 한국어 근사치로 적었어요</p>
</main><script>
const DAYS=[
{day:'DAY 01',entries:[
{ko:'사과',items:[['영어','apple','애플','I eat an apple.','나는 사과를 먹어요.'],['스페인어','manzana','만사나','Como una manzana.','나는 사과를 먹어요.'],['독일어','der Apfel','데어 압펠','Ich esse einen Apfel.','나는 사과를 먹어요.'],['중국어','苹果','píngguǒ · 핑궈','我吃苹果。','나는 사과를 먹어요.','Wǒ chī píngguǒ.']]},
{ko:'창문',items:[['영어','window','윈도우','Please open the window.','창문을 열어 주세요.'],['스페인어','la ventana','라 벤타나','Abre la ventana, por favor.','창문을 열어 주세요.'],['독일어','das Fenster','다스 펜스터','Bitte öffne das Fenster.','창문을 열어 주세요.'],['중국어','窗户','chuānghu · 촹후','请打开窗户。','창문을 열어 주세요.','Qǐng dǎkāi chuānghu.']]},
{ko:'비',items:[['영어','rain','레인','The rain is heavy today.','오늘 비가 많이 와요.'],['스페인어','la lluvia','라 유비아','Hoy llueve mucho.','오늘 비가 많이 와요.'],['독일어','der Regen','데어 레겐','Heute regnet es stark.','오늘 비가 많이 와요.'],['중국어','雨','yǔ · 위','今天雨很大。','오늘 비가 많이 와요.','Jīntiān yǔ hěn dà.']]},
{ko:'숲',items:[['영어','forest','포리스트','We walked through the forest.','우리는 숲을 걸었어요.'],['스페인어','el bosque','엘 보스케','Caminamos por el bosque.','우리는 숲을 걸었어요.'],['독일어','der Wald','데어 발트','Wir gingen durch den Wald.','우리는 숲을 걸었어요.'],['중국어','森林','sēnlín · 썬린','我们穿过了森林。','우리는 숲을 걸었어요.','Wǒmen chuānguò le sēnlín.']]},
{ko:'숟가락',items:[['영어','spoon','스푼','I need a spoon.','숟가락이 필요해요.'],['스페인어','la cuchara','라 쿠차라','Necesito una cuchara.','숟가락이 필요해요.'],['독일어','der Löffel','데어 뢰펠','Ich brauche einen Löffel.','숟가락이 필요해요.'],['중국어','勺子','sháozi · 사오쯔','我需要一把勺子。','숟가락이 필요해요.','Wǒ xūyào yì bǎ sháozi.']]},
{ko:'열쇠',items:[['영어','key','키','Where is my key?','내 열쇠 어디 있지?'],['스페인어','la llave','라 야베','¿Dónde está mi llave?','내 열쇠 어디 있지?'],['독일어','der Schlüssel','데어 슐뤼셀','Wo ist mein Schlüssel?','내 열쇠 어디 있지?'],['중국어','钥匙','yàoshi · 야오스','我的钥匙在哪儿？','내 열쇠 어디 있지?','Wǒ de yàoshi zài nǎr?']]},
{ko:'미소',items:[['영어','smile','스마일','Her smile is lovely.','그녀의 미소는 사랑스러워요.'],['스페인어','la sonrisa','라 손리사','Su sonrisa es encantadora.','그녀의 미소는 사랑스러워요.'],['독일어','das Lächeln','다스 레헬른','Ihr Lächeln ist bezaubernd.','그녀의 미소는 사랑스러워요.'],['중국어','微笑','wēixiào · 웨이샤오','她的微笑很可爱。','그녀의 미소는 사랑스러워요.','Tā de wēixiào hěn kě’ài.']]},
{ko:'가볍다',items:[['영어','light','라이트','This bag is light.','이 가방은 가벼워요.'],['스페인어','ligero / ligera','리헤로 / 리헤라','Esta bolsa es ligera.','이 가방은 가벼워요.'],['독일어','leicht','라이히트','Diese Tasche ist leicht.','이 가방은 가벼워요.'],['중국어','轻','qīng · 칭','这个包很轻。','이 가방은 가벼워요.','Zhège bāo hěn qīng.']]},
{ko:'기억하다',items:[['영어','remember','리멤버','I remember her name.','나는 그녀의 이름을 기억해요.'],['스페인어','recordar','레코르다르','Recuerdo su nombre.','나는 그녀의 이름을 기억해요.'],['독일어','sich erinnern','지히 에린언','Ich erinnere mich an ihren Namen.','나는 그녀의 이름을 기억해요.'],['중국어','记得','jìde · 지더','我记得她的名字。','나는 그녀의 이름을 기억해요.','Wǒ jìde tā de míngzi.']]},
{ko:'꿈꾸다',items:[['영어','dream','드림','I dream about traveling.','나는 여행하는 꿈을 꿔요.'],['스페인어','soñar','소냐르','Sueño con viajar.','나는 여행하는 꿈을 꿔요.'],['독일어','träumen','트로이멘','Ich träume vom Reisen.','나는 여행하는 꿈을 꿔요.'],['중국어','梦想','mèngxiǎng · 멍샹','我梦想去旅行。','나는 여행하는 꿈을 꿔요.','Wǒ mèngxiǎng qù lǚxíng.']]}
]}
];
const LANG={'영어':'en','스페인어':'es','독일어':'de','중국어':'zh'};
let cur=DAYS.length-1;
function render(list){document.querySelector('#cards').innerHTML=list.map((e,i)=>{const n=String(i+1).padStart(2,'0');return `<article class="card" tabindex="0" aria-label="단어 ${n}, 눌러서 뒤집기"><div class="flip">
<div class="face front"><div class="words">${e.items.map(x=>`<div class="entry l-${LANG[x[0]]||'en'}"><span class="lang">${x[0]}</span><span class="word">${x[1]}</span><span class="pron">${x[2]}</span></div>`).join('')}</div></div>
<div class="face back"><div class="meaning">${e.ko}${e._day?`<span class="dtag">${e._day}</span>`:''}</div><div class="hint">${e.items[0][4]}</div><div class="words">${e.items.map(x=>`<div class="entry l-${LANG[x[0]]||'en'}"><span class="lang">${x[0]}</span><span class="word">${x[1]}</span><div class="example">${x[3]}</div>${x[5]?`<div class="pinyin">${x[5]}</div>`:''}</div>`).join('')}</div></div>
</div></article>`}).join('')}
const cards=document.querySelector('#cards');cards.onclick=e=>{const c=e.target.closest('.card');if(c)c.classList.toggle('on')};cards.onkeydown=e=>{const c=e.target.closest('.card');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();c.classList.toggle('on')}};
document.querySelector('#flipall').onclick=()=>{const all=[...document.querySelectorAll('.card')];const to=!all.every(c=>c.classList.contains('on'));all.forEach(c=>c.classList.toggle('on',to))};
const $=q=>document.querySelector(q);
function show(d){cur=d;const D=DAYS[d];$('#count').textContent=`${D.day} · ${D.entries.length}개`;drawNav(d);render(D.entries)}
function drawNav(d){$('#days').innerHTML=DAYS.map((x,i)=>`<button class="${i===d?'on':''}" data-d="${i}">${x.day}</button>`).join('')}
$('#days').onclick=e=>{const b=e.target.closest('button');if(b)show(+b.dataset.d)};
let sel=new Set([DAYS.length-1]);
function drawRv(){$('#rvdays').innerHTML=DAYS.map((x,i)=>`<button class="chip ${sel.has(i)?'on':''}" data-d="${i}" aria-pressed="${sel.has(i)}">${x.day}</button>`).join('');
 const total=[...sel].reduce((a,i)=>a+DAYS[i].entries.length,0),n=+$('#rvn').value,k=n?Math.min(n,total):total;
 $('#rvgo').disabled=!sel.size;$('#rvgo').textContent=sel.size?`복습 시작 · ${k}개`:'날짜를 골라 주세요';$('#rvall').textContent=sel.size===DAYS.length?'선택 해제':'전체 선택'}
$('#rvdays').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=+b.dataset.d;sel.has(d)?sel.delete(d):sel.add(d);drawRv()};
$('#rvall').onclick=()=>{sel=sel.size===DAYS.length?new Set():new Set(DAYS.map((_,i)=>i));drawRv()};
$('#rvn').onchange=drawRv;
$('#rvgo').onclick=()=>{const ds=[...sel].sort((a,b)=>a-b);let pool=ds.flatMap(i=>DAYS[i].entries.map(e=>({...e,_day:DAYS[i].day})));
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 const n=+$('#rvn').value;if(n)pool=pool.slice(0,n);
 $('#count').textContent=`랜덤 복습 · ${ds.map(i=>DAYS[i].day.replace('DAY ','')).join(', ')}일차 · ${pool.length}개`;drawNav(-1);render(pool);$('#cards').scrollIntoView({behavior:'smooth',block:'start'})};
show(cur);drawRv();
</script></body></html>
