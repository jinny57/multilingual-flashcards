<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 다국어 낱말카드</title>
<style>
:root{--ink:#202923;--muted:#64736a;--paper:#f5f7f2;--green:#315d47;--line:#dce4dc;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
main{max-width:1050px;margin:auto;padding:42px 22px 64px}header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}h1{font-size:clamp(26px,4vw,38px);margin:0 0 8px;letter-spacing:-.04em}.sub{color:var(--muted);margin:0}.count{font-size:14px;color:var(--green);font-weight:700;white-space:nowrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.toolbar button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 16px;font:inherit;cursor:pointer}.toolbar button:hover,.toolbar button:focus-visible{outline:2px solid #88a992}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:16px}.card{border:1px solid var(--line);background:var(--white);border-radius:18px;min-height:245px;padding:20px;box-shadow:0 3px 12px #273d2c0b;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #273d2c12}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.meaning{font-size:28px;font-weight:750;margin:18px 0 4px}.hint{font-size:13px;color:var(--muted)}.words{display:grid;gap:12px;margin-top:18px}.entry{border-top:1px solid #edf0eb;padding-top:10px}.lang{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}.word{font-weight:700;font-size:17px;margin-left:7px}.pron{color:var(--muted);font-size:13px;margin-left:5px}.example{font-size:14px;margin-top:5px;line-height:1.45}.translation{font-size:12px;color:var(--muted);margin-top:2px}.tip{text-align:center;color:var(--muted);font-size:13px;margin:20px 0 0}
@media print{body{background:#fff}main{padding:12px}.toolbar,.tip{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.card{break-inside:avoid;box-shadow:none;min-height:0;padding:13px}.meaning{margin:10px 0 2px;font-size:22px}}
</style></head><body><main>
<header><div><h1>오늘의 다국어 낱말카드</h1><p class="sub">같은 뜻을 영어·스페인어·독일어로 익혀요</p></div><div class="count">DAY 01 · 10개</div></header>
<div class="toolbar"><button id="shuffle">순서 섞기</button><button id="reset">처음 순서</button><button onclick="window.print()">인쇄하기</button></div>
<section class="grid" id="cards" aria-label="다국어 낱말카드"></section><p class="tip">예문까지 함께 읽어보세요 · 발음 표기는 한국어로 적은 근사치예요</p>
</main><script>
const entries=[
{ko:'사과',items:[['영어','apple','애플','I eat an apple.','나는 사과를 먹어요.'],['스페인어','manzana','만사나','Como una manzana.','나는 사과를 먹어요.'],['독일어','der Apfel','데어 압펠','Ich esse einen Apfel.','나는 사과를 먹어요.']]},
{ko:'창문',items:[['영어','window','윈도우','Please open the window.','창문을 열어 주세요.'],['스페인어','la ventana','라 벤타나','Abre la ventana, por favor.','창문을 열어 주세요.'],['독일어','das Fenster','다스 펜스터','Bitte öffne das Fenster.','창문을 열어 주세요.']]},
{ko:'비',items:[['영어','rain','레인','The rain is heavy today.','오늘 비가 많이 와요.'],['스페인어','la lluvia','라 유비아','Hoy llueve mucho.','오늘 비가 많이 와요.'],['독일어','der Regen','데어 레겐','Heute regnet es stark.','오늘 비가 많이 와요.']]},
{ko:'숲',items:[['영어','forest','포리스트','We walked through the forest.','우리는 숲을 걸었어요.'],['스페인어','el bosque','엘 보스케','Caminamos por el bosque.','우리는 숲을 걸었어요.'],['독일어','der Wald','데어 발트','Wir gingen durch den Wald.','우리는 숲을 걸었어요.']]},
{ko:'숟가락',items:[['영어','spoon','스푼','I need a spoon.','숟가락이 필요해요.'],['스페인어','la cuchara','라 쿠차라','Necesito una cuchara.','숟가락이 필요해요.'],['독일어','der Löffel','데어 뢰펠','Ich brauche einen Löffel.','숟가락이 필요해요.']]},
{ko:'열쇠',items:[['영어','key','키','Where is my key?','내 열쇠 어디 있지?'],['스페인어','la llave','라 야베','¿Dónde está mi llave?','내 열쇠 어디 있지?'],['독일어','der Schlüssel','데어 슐뤼셀','Wo ist mein Schlüssel?','내 열쇠 어디 있지?']]},
{ko:'미소',items:[['영어','smile','스마일','Her smile is lovely.','그녀의 미소는 사랑스러워요.'],['스페인어','la sonrisa','라 손리사','Su sonrisa es encantadora.','그녀의 미소는 사랑스러워요.'],['독일어','das Lächeln','다스 레헬른','Ihr Lächeln ist bezaubernd.','그녀의 미소는 사랑스러워요.']]},
{ko:'가볍다',items:[['영어','light','라이트','This bag is light.','이 가방은 가벼워요.'],['스페인어','ligero / ligera','리헤로 / 리헤라','Esta bolsa es ligera.','이 가방은 가벼워요.'],['독일어','leicht','라이히트','Diese Tasche ist leicht.','이 가방은 가벼워요.']]},
{ko:'기억하다',items:[['영어','remember','리멤버','I remember her name.','나는 그녀의 이름을 기억해요.'],['스페인어','recordar','레코르다르','Recuerdo su nombre.','나는 그녀의 이름을 기억해요.'],['독일어','sich erinnern','지히 에린언','Ich erinnere mich an ihren Namen.','나는 그녀의 이름을 기억해요.']]},
{ko:'꿈꾸다',items:[['영어','dream','드림','I dream about traveling.','나는 여행하는 꿈을 꿔요.'],['스페인어','soñar','소냐르','Sueño con viajar.','나는 여행하는 꿈을 꿔요.'],['독일어','träumen','트로이멘','Ich träume vom Reisen.','나는 여행하는 꿈을 꿔요.']]}
];
const original=[...entries];
function render(list){document.querySelector('#cards').innerHTML=list.map((e,i)=>`<article class="card"><div class="top"><span>단어 ${String(i+1).padStart(2,'0')}</span><span>뜻과 예문</span></div><div class="meaning">${e.ko}</div><div class="hint">영어 · 스페인어 · 독일어</div><div class="words">${e.items.map(x=>`<div class="entry"><span class="lang">${x[0]}</span><span class="word">${x[1]}</span><span class="pron">(${x[2]})</span><div class="example">${x[3]}</div><div class="translation">${x[4]}</div></div>`).join('')}</div></article>`).join('')}
render(entries);document.querySelector('#shuffle').onclick=()=>{const a=[...entries];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}render(a)};document.querySelector('#reset').onclick=()=>render(original);
</script></body></html>
