function say(t,l){return TTS?`<button type="button" class="say" data-t="${esc(t)}" data-l="${VOICE[l]||'en-US'}" aria-label="${esc(t)} 발음 듣기">${ICON}</button>`:''}
function speak(t,l){const S=speechSynthesis;S.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=l==='zh-CN'?.8:.9;const v=S.getVoices().filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(l.slice(0,2).toLowerCase()));u.voice=v.find(v=>v.lang.replace('_','-')===l)||v[0]||null;S.speak(u)}
if(TTS)speechSynthesis.getVoices();

</div></article>`}).join('')}
const cards=document.querySelector('#cards');cards.onclick=e=>{const sb=e.target.closest('.say');if(sb){e.stopPropagation();speak(sb.dataset.t,sb.dataset.l);sb.classList.add('on');setTimeout(()=>sb.classList.remove('on'),900);return}const c=e.target.closest('.card');if(c)c.classList.toggle('on')};cards.onkeydown=e=>{const c=e.target.closest('.card');if(c&&!e.target.closest('.say')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();c.classList.toggle('on')}};
document.querySelector('#flipall').onclick=()=>{const all=[...document.querySelectorAll('.card')];const to=!all.every(c=>c.classList.contains('on'));all.forEach(c=>c.classList.toggle('on',to))};
const $=q=>document.querySelector(q);
function show(d){cur=d;const D=DAYS[d];$('#count').textContent=`${D.day} · ${D.entries.length}개`;drawNav(d);render(D.entries)}
function drawNav(d){$('#days').innerHTML=DAYS.map((x,i)=>`<button class="${i===d?'on':''}" data-d="${i}">${x.day}</button>`).join('')}
$('#days').onclick=e=>{const b=e.target.closest('button');if(b)show(+b.dataset.d)};
let sel=new Set([DAYS.length-1]);
function drawRv(){$('#rvdays').innerHTML=DAYS.map((x,i)=>`<button class="chip ${sel.has(i)?'on':''}" data-d="${i}" aria-pressed="${sel.has(i)}">${x.day}</button>`).join('');
 const total=[...sel].reduce((a,i)=>a+DAYS[i].entries.length,0),n=+$('#rvn').value,k=n?Math.min(n,total):total;
 $('#rvgo').disabled=!sel.size;$('#rvgo').textContent=sel.size?`복습 시작 · ${k}개`:'날짜를 골라 주세요';$('#rvall').textContent=sel.size===DAYS.length?'선택 해제':'전체 선택'}
$('#rvdays').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=+b.dataset.d;sel.has(d)?sel.delete(d):sel.add(d);drawRv()};
$('#rvall').onclick=()=>{sel=sel.size===DAYS.length?new Set():new Set(DAYS.map((_,i)=>i));drawRv()};
$('#rvn').onchange=drawRv;
$('#rvgo').onclick=()=>{const ds=[...sel].sort((a,b)=>a-b);let pool=ds.flatMap(i=>DAYS[i].entries.map(e=>({...e,_day:DAYS[i].day})));
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 const n=+$('#rvn').value;if(n)pool=pool.slice(0,n);
 $('#count').textContent=`랜덤 복습 · ${ds.map(i=>DAYS[i].day.replace('DAY ','')).join(', ')}일차 · ${pool.length}개`;drawNav(-1);render(pool);$('#cards').scrollIntoView({behavior:'smooth',block:'start'})};
show(cur);drawRv();
</script></body></html>
